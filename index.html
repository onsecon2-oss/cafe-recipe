<!doctype html><html><head><meta charset="utf-8"><title>카페 레시피 암기장</title><meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="레시피"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 상단 고정 탭 + 한 열 카드. 카드마다 [이름·가격] → [핵심 재료 칩] → [HOT/ICE 순서 흐름] */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --ink:#13202c; --muted:#586979; --line:#d5dde6;
  --accent:#1c5bcc; --on-accent:#ffffff; --chip:#e8eef5;
  --hot:#b93a26; --hot-bg:#fde8e3; --ice:#1668ad; --ice-bg:#e0effb; --warn:#8a5a00; --warn-bg:#fff2cf;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#172029; --ink:#e7eef5; --muted:#93a4b4; --line:#2a3743;
  --accent:#6ea8ff; --on-accent:#0b1522; --chip:#222e3a;
  --hot:#ff927c; --hot-bg:#3b1f1a; --ice:#7fc3f7; --ice-bg:#14303f; --warn:#f2c865; --warn-bg:#3a2f12; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#172029; --ink:#e7eef5; --muted:#93a4b4; --line:#2a3743;
  --accent:#6ea8ff; --on-accent:#0b1522; --chip:#222e3a;
  --hot:#ff927c; --hot-bg:#3b1f1a; --ice:#7fc3f7; --ice-bg:#14303f; --warn:#f2c865; --warn-bg:#3a2f12; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:.01em}
.lede{color:var(--muted);margin:4px 0 0;font-size:13.5px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);margin-top:14px}
.tools{display:flex;gap:8px}
.tools input{flex:1;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.tools button{font:inherit;font-weight:700;padding:9px 12px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;white-space:nowrap}
.tools button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:inherit;font-size:14px;font-weight:500;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.sec{margin-top:22px}
.sec h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0 0 2px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2 small{font-family:var(--body);font-size:12.5px;color:var(--muted);font-weight:500}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.head{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:default}
.quiz .head{cursor:pointer}
.name{flex:1;min-width:0;font-weight:700;font-size:16.5px;line-height:1.3}
.name span{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.price{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--accent)}
.tag{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap}
.tag.h{background:var(--hot-bg);color:var(--hot)} .tag.i{background:var(--ice-bg);color:var(--ice)}
.tag.m{background:var(--chip);color:var(--muted)}
.body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.quiz .card:not(.open) .body{display:none}
.quiz .card:not(.open) .price{visibility:hidden}
.quiz .card:not(.open) .head::after{content:"탭해서 확인";font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--chip);border-radius:6px;padding:3px 8px;font-size:13px;font-weight:500}
.row{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:start}
.row > b{font-size:11.5px;text-align:center;padding:3px 0;border-radius:5px;margin-top:1px}
.row > b.h{background:var(--hot-bg);color:var(--hot)} .row > b.i{background:var(--ice-bg);color:var(--ice)} .row > b.g{background:var(--chip);color:var(--muted)}
.flow{display:flex;flex-wrap:wrap;gap:4px 0;min-width:0}
.flow span{white-space:normal}
.flow span + span::before{content:"→";color:var(--accent);font-weight:700;margin:0 6px}
.vars{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.var{display:grid;grid-template-columns:minmax(64px,auto) 1fr;gap:10px}
.var > b{font-size:13.5px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:6px 10px;font-size:13px}

.rule{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.rule h3{margin:0 0 6px;font-size:15px}
.rule ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.ladder{display:grid;grid-template-columns:52px 1fr;gap:6px 12px;align-items:baseline}
.ladder b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}
.check{display:flex;flex-direction:column;gap:2px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check label:last-child{border-bottom:0}
.check input{margin-top:4px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.empty{color:var(--muted);padding:24px 0;text-align:center}
</style>

<div class="wrap">
  <h1>카페 레시피 암기장</h1>

</div>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const flow = a => '<div class="flow">' + a.map(x => '<span>' + esc(x) + '</span>').join('') + '</div>';

let tab = 'coffee', quiz = false;

function card(it){
  const tags = {b:'<span class="tag h">HOT</span><span class="tag i">ICE</span>', i:'<span class="tag i">Only ICE</span>', h:'<span class="tag h">Only HOT</span>', x:''}[it.tp];
  const price = it.p === undefined ? '' : '<span class="price">' + (typeof it.p === 'number' ? it.p.toFixed(1) : esc(it.p)) + '</span>';
  let b = '';
  if (it.k) b += '<div class="chips">' + it.k.map(k => '<span>' + esc(k) + '</span>').join('') + '</div>';
  if (it.h) b += '<div class="row"><b class="h">HOT</b>' + flow(it.h) + '</div>';
  if (it.i) b += '<div class="row"><b class="i">ICE</b>' + flow(it.i) + '</div>';
  if (it.g) b += '<div class="row"><b class="g">순서</b>' + flow(it.g) + '</div>';
  if (it.v) b += '<div class="vars">' + it.v.map(v => '<div class="var"><b>' + esc(v[0]) + '</b><div>' + esc(v[1]) + '</div></div>').join('') + '</div>';
  if (it.note) b += '<div class="note">' + esc(it.note) + '</div>';
  return '<article class="card"><button type="button" class="head"><span class="name">' + esc(it.n) + (it.s ? '<span>' + esc(it.s) + '</span>' : '') + '</span>' +
    (it.m ? '<span class="tag m">표기 ' + esc(it.m) + '</span>' : '') + tags + price + '</button><div class="body">' + b + '</div></article>';
}
function section(c, items){
  return '<section class="sec"><h2>' + esc(c.t) + '<small>' + esc(c.sub) + '</small></h2><div class="list">' + items.map(card).join('') + '</div></section>';
}
function ladder(){
  const m = new Map();
  D.forEach(c => c.items.forEach(it => { if (typeof it.p === 'number'){ if (!m.has(it.p)) m.set(it.p, []); m.get(it.p).push(it.n); } }));
  return [...m.keys()].sort((a,b) => a-b).map(p => '<b>' + p.toFixed(1) + '</b><div>' + m.get(p).map(esc).join(' · ') + '</div>').join('');
}
function rules(){
  return '<section class="sec"><h2>암기 공식<small>메뉴를 묶어서 외우는 규칙</small></h2><div class="list">' +
    RULES.map(r => '<div class="rule"><h3>' + esc(r[0]) + '</h3><ul>' + r[1].map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>').join('') +
    '<div class="rule"><h3>가격 사다리 (천원)</h3><div class="ladder">' + ladder() + '</div></div></div></section>';
}
function closing(){
  let n = 0;
  return '<section class="sec"><h2>마감<small>체크하면서 진행</small></h2><div class="list">' +
    CLOSE.map(g => '<div class="rule"><h3>' + esc(g[0]) + '</h3><div class="check">' +
      g[1].map(x => { n++; return '<label for="ck' + n + '"><input type="checkbox" id="ck' + n + '"><span>' + esc(x) + '</span></label>'; }).join('') + '</div></div>').join('') + '</div></section>';
}
function render(){
  const q = $('#q').value.trim().toLowerCase();
  let html = '';
  if (q){
    D.forEach(c => { const hit = c.items.filter(it => JSON.stringify(it).toLowerCase().includes(q)); if (hit.length) html += section(c, hit); });
    if (!html) html = '<p class="empty">"' + esc(q) + '"에 맞는 메뉴가 없습니다. 재료 이름을 짧게 입력해 보세요.</p>';
  } else if (tab === 'rules') html = rules();
  else if (tab === 'close') html = closing();
  else { const c = D.find(c => c.id === tab); html = section(c, c.items); }
  $('#out').innerHTML = html;
  $('#tabs').innerHTML = TABS.map(t => '<button type="button" role="tab" data-id="' + t.id + '" aria-selected="' + (!q && t.id === tab) + '">' + esc(t.t) + '</button>').join('');
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.id; $('#q').value = ''; render(); window.scrollTo(0, 0); });
$('#q').addEventListener('input', render);
$('#out').addEventListener('click', e => { if (!quiz) return; const h = e.target.closest('.head'); if (h) h.parentElement.classList.toggle('open'); });
$('#quizBtn').addEventListener('click', () => {
  quiz = !quiz; document.body.classList.toggle('quiz', quiz);
  $('#quizBtn').setAttribute('aria-pressed', quiz); $('#quizBtn').textContent = quiz ? '암기 모드 끄기' : '암기 모드';
  document.querySelectorAll('.card.open').forEach(c => c.classList.remove('open'));
});
render();
